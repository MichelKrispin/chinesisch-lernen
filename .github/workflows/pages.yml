name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lerninhalte und App prüfen
        run: |
          node tests/validate-data.mjs
          node tests/vocabulary-reference.test.mjs
          node tests/examples.test.mjs
          node tests/progress.test.mjs
          node tests/scheduler.test.mjs
          node tests/writing.test.mjs
          node tests/writing-page.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
